[project]
name = "autoagent"
version = "0.1.0"
description = "Automated Agent AI Testing Tool (backend MVP)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
  "httpx>=0.27",
  "openai>=1.12",
  "playwright>=1.46,<2.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1,<3.0",
  "uiautomator2>=3.2,<4.0",
  "rapidocr_onnxruntime>=1.4,<2.0",
  "mss>=9.0",
  "pyautogui>=0.9.54",
  "pyperclip>=1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "ruff>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "playwright: requires real Chromium via `python3.11 -m playwright install chromium`",
  "android: requires adb + emulator/real device",
  "slow: slower OCR and image-processing coverage",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# FastAPI uses function calls (Depends/Form/File/Query/Body) in parameter defaults by design.
extend-safe-fixes = []

[tool.ruff.lint.extend-per-file-ignores]
"src/autoagent/api/*.py" = ["B008"]
"src/autoagent/auth/deps.py" = ["B008"]
# Pre-existing >100-col lines that predate `ruff check` actually being run
# repo-wide in CI (it was only ever spot-checked against touched files).
# ruff format doesn't autofix E501, and reflowing these — several are long
# XML/HTML test fixture literals — is the same deferred mass-reformat task
# CI already doesn't gate on for `ruff format --check`. New code in these
# files should still stay under 100 cols; this isn't a green light to add
# more.
"src/autoagent/api/batches.py" = ["E501"]
"src/autoagent/api/profile_builder.py" = ["E501"]
"src/autoagent/api/web_profile_builder.py" = ["E501"]
"src/autoagent/executors/profile_builder_generator.py" = ["E501"]
"src/autoagent/executors/profile_builder_new_session.py" = ["E501"]
"tests/integration/test_profile_builder_endpoints.py" = ["E501"]
# F811/F401: this file imports `client` plus two autouse fixtures from
# test_profile_builder_endpoints.py to reuse them (standard cross-file
# pytest fixture sharing) — pyflakes can't see that pytest's fixture
# discovery needs these names bound in this module even though nothing
# calls them by name directly (client is injected per test function,
# matching F811; the autouse ones fire for every test in this module
# purely by being importable here, matching F401).
"tests/integration/test_profile_builder_new_session_endpoints.py" = ["E501", "F811", "F401"]
"tests/unit/test_android_executor_unit.py" = ["E501"]
"tests/unit/test_profile_builder_candidates.py" = ["E501"]
"tests/unit/test_response_extractor_ui_tree.py" = ["E501"]
"tests/unit/test_web_executor_unit.py" = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
