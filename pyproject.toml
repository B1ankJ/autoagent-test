[project]
name = "autoagent"
version = "0.1.0"
description = "Automated Agent AI Testing Tool (backend MVP)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7",
  "httpx>=0.27",
  "openai>=1.12",
  "playwright>=1.46,<2.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1,<3.0",
  "uiautomator2>=3.2,<4.0",
  "rapidocr_onnxruntime>=1.4,<2.0",
  "mss>=9.0",
  "pyautogui>=0.9.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "ruff>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "playwright: requires real Chromium via `python3.11 -m playwright install chromium`",
  "android: requires adb + emulator/real device",
  "slow: slower OCR and image-processing coverage",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# FastAPI uses function calls (Depends/Form/File/Query/Body) in parameter defaults by design.
extend-safe-fixes = []

[tool.ruff.lint.extend-per-file-ignores]
"src/autoagent/api/*.py" = ["B008"]
"src/autoagent/auth/deps.py" = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
